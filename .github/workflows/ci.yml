name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Keep scratch files in the checkout
        run: |
          $scratch = Join-Path $PWD 'tmp'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          "TEMP=$scratch", "TMP=$scratch", "TMPDIR=$scratch" | Add-Content $env:GITHUB_ENV
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build libcurl4-openssl-dev
      - name: Validate pinned CMake dependency declarations
        run: pwsh -NoProfile -File dd.ps1 dep install --non-interactive
      - name: Check native toolchain and dependencies
        run: pwsh -NoProfile -File dd.ps1 doctor --non-interactive
      - name: Build and test Release and Debug (offline fixtures)
        run: pwsh -NoProfile -File dd.ps1 test --non-interactive
      - name: Sanitizers (offline fixtures)
        run: pwsh -NoProfile -File dd.ps1 asan --yes --non-interactive
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libcfindata-${{ runner.os }}-diagnostics
          path: |
            tmp/**/dd-logs/*.log
            tmp/**/dd-ctest-*.xml
            build/**/Testing/Temporary/*.log
            build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
